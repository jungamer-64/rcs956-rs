[package]
name = "rcs956-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Command-line discovery and NFC communication for RC-S956"

[[bin]]
name = "rcs956"
path = "src/main.rs"
doc = false

[dependencies]
rcs956 = { path = "../../core", version = "0.1" }

[target.'cfg(windows)'.dependencies]
rcs956-usb-abi = { path = "../../driver/usb-abi" }
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[lints]
workspace = true
