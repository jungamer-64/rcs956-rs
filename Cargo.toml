[workspace]
members = ["core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[package]
name = "rcs956"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "WinUSB host binding and command-line interface for the RC-S956 USB reader"

[lib]
path = "src/lib.rs"

[[bin]]
name = "rcs956"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Devices_Usb", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_Security"] }

[dependencies]
rcs956-core = { path = "core", version = "0.1" }

[lints]
workspace = true

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unnameable_types = "deny"
unsafe_op_in_unsafe_fn = "forbid"
unused = { level = "deny", priority = -1 }
unfulfilled_lint_expectations = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
allow_attributes_without_reason = "deny"

