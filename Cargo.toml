[package]
name = "rcs956"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "RC-S956 reader framing, transactions, and NFC card protocols"

[features]
felica-lite-s = ["dep:des", "dep:subtle", "dep:zeroize"]
felica-standard-aes = ["dep:aes", "dep:cmac", "dep:subtle", "dep:zeroize"]

[dependencies]
aes = { version = "0.9", features = ["zeroize"], optional = true }
cmac = { version = "0.8", features = ["zeroize"], optional = true }
des = { version = "0.9", features = ["zeroize"], optional = true }
subtle = { version = "2.6", default-features = false, optional = true }
zeroize = { version = "1", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
serde_json = "1"

[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unnameable_types = "deny"
unsafe_op_in_unsafe_fn = "forbid"
unused = { level = "deny", priority = -1 }
unfulfilled_lint_expectations = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
allow_attributes_without_reason = "deny"
