[workspace]
members = ["core", "driver", "driver/usb-abi", "tools/cli"]
default-members = ["core"]
resolver = "3"

[workspace.metadata.wdk.driver-model]
driver-type = "UMDF"
umdf-version-major = 2
target-umdf-version-minor = 33

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[package]
name = "rcs956"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Windows client for the RC-S956 USB driver"

[lib]
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
rcs956-usb-abi = { path = "driver/usb-abi" }
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dependencies]
rcs956-core = { path = "core", version = "0.1" }

[lints]
workspace = true

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unnameable_types = "deny"
unsafe_op_in_unsafe_fn = "forbid"
unused = { level = "deny", priority = -1 }
unfulfilled_lint_expectations = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
allow_attributes_without_reason = "deny"

